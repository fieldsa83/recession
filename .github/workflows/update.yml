name: Update Visualization

on:
  schedule:
    - cron: '30 21 * * 1-5'  # 21:30 UTC (after US market close) on weekdays
  workflow_dispatch:        # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true   # prebuilt Linux binaries, no compiling

    - name: Install R packages (with system deps, cached)
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: |
          any::TTR
          any::quantmod
          any::dplyr
          any::lubridate
          any::plotly
          any::htmlwidgets
          any::knitr
          any::rmarkdown

    - name: Install Quarto
      uses: quarto-dev/quarto-actions/setup@v2
        
    - name: Run visualization script
      run: |
        set -o pipefail
        if ! Rscript sp500_visualization.R 2>&1 | tee viz.log; then
          msg=$(tail -n 25 viz.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=R script failed::$msg"
          exit 1
        fi
        
    - name: Render Quarto document
      run: |
        set -o pipefail
        if ! quarto render index.qmd 2>&1 | tee render.log; then
          msg=$(tail -n 25 render.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Quarto render failed::$msg"
          exit 1
        fi
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
        keep_files: true
